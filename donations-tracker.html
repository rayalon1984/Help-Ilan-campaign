<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב תרומות - אילן מדינה</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .summary-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .add-form {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        button {
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #45a049;
        }

        .clear-btn {
            background: #f44336;
        }

        .clear-btn:hover {
            background: #da190b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .delete-btn {
            background: #f44336;
            padding: 5px 10px;
            font-size: 0.9em;
        }

        .export-btn {
            background: #2196f3;
            margin-left: 10px;
        }

        .note {
            background: #fff3cd;
            border-right: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 מעקב תרומות - קמפיין אילן מדינה</h1>
        <p class="subtitle">כלי פנימי למעקב אחר תרומות</p>

        <div class="note">
            <strong>⚠️ הערה:</strong> הנתונים נשמרים במחשב שלך בלבד (localStorage). גבה אותם מדי פעם באמצעות כפתור "ייצא ל-CSV".
        </div>

        <div class="summary">
            <div class="summary-card">
                <div class="summary-value" id="totalAmount">₪0</div>
                <div class="summary-label">סה"כ נאסף</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="donorCount">0</div>
                <div class="summary-label">מספר תורמים</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="goalPercent">0%</div>
                <div class="summary-label">מהיעד (70,000 ₪)</div>
            </div>
        </div>

        <div class="add-form">
            <h3>➕ הוסף תרומה</h3>
            <div class="form-row">
                <input type="text" id="donorName" placeholder="שם התורם/ת">
                <input type="number" id="amount" placeholder="סכום (₪)">
                <input type="date" id="date">
                <button onclick="addDonation()">הוסף</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <button onclick="exportCSV()" class="export-btn">📥 ייצא ל-CSV</button>
            <button onclick="clearAll()" class="clear-btn">🗑️ נקה הכל</button>
        </div>

        <table id="donationsTable">
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>שם</th>
                    <th>סכום</th>
                    <th>פעולות</th>
                </tr>
            </thead>
            <tbody id="donationsBody">
            </tbody>
        </table>
    </div>

    <script>
        const GOAL = 70000;
        let donations = JSON.parse(localStorage.getItem('donations') || '[]');

        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();

        function saveDonations() {
            localStorage.setItem('donations', JSON.stringify(donations));
            updateDisplay();
        }

        function addDonation() {
            const name = document.getElementById('donorName').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;

            if (!name || !amount || !date) {
                alert('נא למלא את כל השדות');
                return;
            }

            donations.push({
                id: Date.now(),
                name,
                amount,
                date
            });

            saveDonations();

            // Clear form
            document.getElementById('donorName').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('date').valueAsDate = new Date();
        }

        function deleteDonation(id) {
            if (confirm('בטוח שברצונך למחוק תרומה זו?')) {
                donations = donations.filter(d => d.id !== id);
                saveDonations();
            }
        }

        function updateDisplay() {
            const total = donations.reduce((sum, d) => sum + d.amount, 0);
            const count = donations.length;
            const percent = Math.round((total / GOAL) * 100);

            document.getElementById('totalAmount').textContent = '₪' + total.toLocaleString('he-IL');
            document.getElementById('donorCount').textContent = count;
            document.getElementById('goalPercent').textContent = percent + '%';

            // Update table
            const tbody = document.getElementById('donationsBody');
            tbody.innerHTML = '';

            // Sort by date (newest first)
            const sorted = [...donations].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(donation => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${new Date(donation.date).toLocaleDateString('he-IL')}</td>
                    <td>${donation.name}</td>
                    <td><strong>₪${donation.amount.toLocaleString('he-IL')}</strong></td>
                    <td><button class="delete-btn" onclick="deleteDonation(${donation.id})">מחק</button></td>
                `;
            });
        }

        function exportCSV() {
            const csv = [
                ['תאריך', 'שם', 'סכום'].join(','),
                ...donations.map(d => [d.date, d.name, d.amount].join(','))
            ].join('\n');

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `donations_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function clearAll() {
            if (confirm('בטוח שברצונך למחוק את כל הנתונים? פעולה זו בלתי הפיכה!')) {
                donations = [];
                saveDonations();
            }
        }

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
